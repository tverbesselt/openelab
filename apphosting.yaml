# Firebase App Hosting — sjabloon voor build- en runtimeconfiguratie van Open E-lab.
# Vul de waarden van je eigen Firebase-project in (zie docs/INSTALLEREN.md).
# Laat waarden leeg of gebruik een ander hostingplatform (Docker, Vercel, Coolify).

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: ""
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ""
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ""
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: ""
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ""
    availability: [ BUILD, RUNTIME ]
  # Optioneel: maak het geheim aan met `firebase apphosting:secrets:set openai-api-key`
  # - variable: OPENAI_API_KEY
  #   secret: openai-api-key
